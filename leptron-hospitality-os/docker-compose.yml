version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leptron-postgres
    environment:
      POSTGRES_USER: leptron
      POSTGRES_PASSWORD: leptron_secure_password_2024
      POSTGRES_DB: leptron_hospitality_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leptron-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leptron -d leptron_hospitality_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leptron-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leptron-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: leptron-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://leptron:leptron_secure_password_2024@postgres:5432/leptron_hospitality_os
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-leptron_jwt_secret_key_enterprise_grade_2024}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-leptron_refresh_secret_key_enterprise_grade_2024}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leptron-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: leptron-web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - leptron-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: leptron-nginx
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - leptron-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  leptron-network:
    driver: bridge
